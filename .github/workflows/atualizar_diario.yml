name: Atualizar Produtos ML

on:
  schedule:
    - cron: "0 12 * * 1-5"
    - cron: "0 11 * * 6"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar requests
        run: pip install requests

      - name: Rodar script
        run: python atualizar_ml.py

      - name: Commitar HTML
        run: |
          git config --local user.email "bot@achadospetsbr.com"
          git config --local user.name "Achados Bot"
          git add index.html
          git diff --staged --quiet || git commit -m "Produtos atualizados"
          git push
